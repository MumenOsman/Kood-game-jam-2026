<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TetherMind</title>
    <style>
        @font-face {
            font-family: 'CyberpunkPixel';
            src: url('./assets/ui/font/CyberpunkCraftpixPixel.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0e14;
            color: #c4d1de;
            font-family: 'CyberpunkPixel', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: url('./assets/ui/cursors/cursor_default.png'), auto;
        }

        #gameContainer {
            position: relative;
            border: 4px solid #1c2433;
            border-radius: 4px;
            background: #000;
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            width: 1280px;
            height: 720px;
            image-rendering: pixelated;
            cursor: url('./assets/ui/cursors/cursor_default.png'), auto;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script type="module" src="./src/main.js?v=20261108_v30"></script>
</body>
</html>
