<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tether Platformer - 2D Pacifist Puzzle Adventure</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #080a0e;
            color: #d8e2ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            margin-bottom: 8px;
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: #ffaa00;
            text-transform: uppercase;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.4);
        }

        .subtitle {
            font-size: 0.82rem;
            color: #788a9e;
            font-family: monospace;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 170, 0, 0.15);
            border: 2px solid #283240;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 1280px;
            height: 720px;
            image-rendering: auto;
        }

        footer {
            margin-top: 10px;
            display: flex;
            gap: 24px;
            font-size: 0.78rem;
            font-family: monospace;
            color: #8c9ba5;
            background: rgba(18, 24, 32, 0.85);
            padding: 6px 16px;
            border-radius: 4px;
            border: 1px solid #222d3b;
        }

        .key-badge {
            display: inline-block;
            background: #2a3647;
            color: #ffdd88;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: bold;
            border: 1px solid #3c4e66;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>TETHER PLATFORMER</h1>
        <div class="subtitle">Core Architecture Prototype - Pacifist Energy Restoration</div>
    </header>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <footer>
        <div><span class="key-badge">A / D</span> Move</div>
        <div><span class="key-badge">Shift</span> Run</div>
        <div><span class="key-badge">Space</span> Jump / Tether Jump</div>
        <div><span class="key-badge">Space / S</span> Wall Jump (when on wall)</div>
        <div><span class="key-badge">S</span> Dock / Rest (on ground)</div>
        <div><span class="key-badge">Hold LMB</span> Aim & Spin Wire</div>
        <div><span class="key-badge">Release LMB</span> Launch Wire</div>
        <div><span class="key-badge">RMB</span> Cut Wire</div>
        <div><span class="key-badge">W / S</span> Reel Cable</div>
        <div><span class="key-badge">E</span> Rotate Junction</div>
    </footer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
